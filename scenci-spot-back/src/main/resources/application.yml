spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: scenci-spot-back
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3406/scenic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.example.scencispotback.domain

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1

app:
  auth:
    token-ttl-seconds: 86400
    code-ttl-seconds: 300
  order:
    unpaid-ttl-minutes: 30
  storage:
    local-base-dir: ${LOCAL_STORAGE_DIR:${user.home}/scenic-spot/uploads}
    public-base-url: ${LOCAL_PUBLIC_BASE_URL:http://127.0.0.1:8080/uploads}
  video-upload:
    base-dir: ${VIDEO_UPLOAD_DIR:${user.home}/Desktop/毕业设计/video}
  video-detection:
    enabled: ${VIDEO_DETECTION_ENABLED:false}
    base-url: ${VIDEO_DETECTION_BASE_URL:http://127.0.0.1:5001}
    timeout-ms: ${VIDEO_DETECTION_TIMEOUT_MS:600000}
    frame-step: ${VIDEO_DETECTION_FRAME_STEP:10}
    worker-threads: ${VIDEO_DETECTION_WORKER_THREADS:2}
  wechat:
    mini:
      app-id: ${WECHAT_MINI_APP_ID:}
      app-secret: ${WECHAT_MINI_APP_SECRET:}
